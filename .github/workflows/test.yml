name: Test and Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: msbuild HalloChat-CSharp.sln /t:Restore /p:Configuration=Release

    - name: Build solution
      run: msbuild HalloChat-CSharp.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU"

    - name: Run tests
      run: |
        # 检查是否存在测试项目
        if (Test-Path "*Tests*" -PathType Container) {
          msbuild HalloChat-CSharp.sln /t:Test /p:Configuration=Release
        } else {
          Write-Host "No test projects found, skipping tests"
        }

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HalloChat-CSharp
        path: |
          bin/Release/
          HalloChat-CSharp.exe
